
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b1b"/>
      <stop offset="55%" stop-color="#101039"/>
      <stop offset="100%" stop-color="#090d20"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#5625ba" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#5625ba" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35" fill="none" stroke="#536bba" stroke-opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

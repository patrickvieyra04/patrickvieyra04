  <ellipse cx="950" cy="130" rx="370" ry="250" fill="url(#glow)"/>

  <g fill="none" stroke="url(#neon)" stroke-width="2" opacity=".65">
    <path d="M760 0V55H850V90H920"/>
    <path d="M1200 230H1080V190H1030"/>
    <path d="M750 320V270H810V240H860"/>
    <circle cx="920" cy="90" r="4" fill="#00d4ff"/>
    <circle cx="1030" cy="190" r="4" fill="#a855f7"/>
    <circle cx="860" cy="240" r="4" fill="#00d4ff"/>
  </g>

  <g transform="translate(75 90)" fill="none" stroke="url(#neon)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 0L5 40L45 80"/>
    <path d="M105 0L145 40L105 80"/>
    <path d="M88 0L62 80"/>
  </g>

  <text x="260" y="112" fill="#ffffff" font-size="57" font-weight="bold" font-family="Arial, sans-serif">Patrick Vieyra</text>
  <rect x="263" y="135" width="105" height="5" rx="3" fill="url(#neon)"/>

  <text x="263" y="184" fill="#53d9ff" font-size="24" font-weight="bold" font-family="Arial, sans-serif">FULL STACK DEVELOPER</text>
  <text x="263" y="220" fill="#b58aff" font-size="23" font-weight="bold" font-family="Arial, sans-serif">AI ENTHUSIAST</text>

  <text x="263" y="267" fill="#b7c7e6" font-size="17" font-family="Arial, sans-serif">Construire aujourd'hui les solutions intelligentes de demain.</text>

  <g font-family="Arial, sans-serif" font-size="16" fill="#d8e8ff" text-anchor="end">
    <text x="1115" y="90">⌘  DEVELOP</text>
    <text x="1115" y="130">✦  INNOVATE</text>
    <text x="1115" y="170">⚡  BUILD</text>
    <text x="1115" y="210">◈  LEARN</text>

  <path d="M75 295H1125" stroke="url(#neon)" stroke-width="2" opacity=".7"/>
  <text x="600" y="310" fill="#8ba5d2" font-size="11" letter-spacing="7" text-anchor="middle" font-family="Arial, sans-serif">CODE  /  LEARN  /  BUILD  /  IMPACT</text>
</svg>

